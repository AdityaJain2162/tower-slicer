# Dev-client APK build — builds a development client APK with Google test ads
# and uploads it as a workflow artifact you can install on your phone.
#
# Triggers:
#   - On push to main (after CI passes)
#   - Manually via "Run workflow" in the Actions tab
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN      — your Expo access token (https://expo.dev/accounts/[you]/settings/access-tokens)
#   EAS_PROJECT_ID  — your EAS project ID (run `eas build:configure` locally once, then copy the
#                     extra.eas.projectId from app.json)
#
# The build uses the "development" profile from eas.json which:
#   - Sets developmentClient: true (includes dev tools + native modules)
#   - Sets distribution: internal (not for Play Store)
#   - Builds an .apk (installable directly, no signing needed)
#   - Sets USE_TEST_ADS=true (Google's official test ad unit IDs)
#
# To install the APK: download the artifact from the workflow run, transfer to
# your phone, and install it (enable "Install unknown apps" for your file
# manager). Open the app → play until game over → tap "Revive & Keep Tower"
# → you should see a real Google test rewarded ad render.
name: Dev Build (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build dev-client APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile development --platform android --non-interactive --no-wait

      - name: Get build URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Wait for the build to complete and get the download URL
          # EAS build takes ~10-15 minutes on the free tier
          echo "Build submitted. Check the EAS dashboard for the download URL:"
          echo "https://expo.dev/accounts/[your-account]/projects/tower-slicer/builds"
          echo ""
          echo "Or run locally to get the URL:"
          echo "  eas build:list --platform android --status finished"
