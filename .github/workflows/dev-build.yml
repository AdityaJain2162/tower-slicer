# Local APK build — builds a debug APK directly in the GitHub Actions runner
# using `expo prebuild` + Gradle. No EAS, no Expo account, no paid cloud
# builds needed. The APK includes native react-native-google-mobile-ads so
# real Google test ads render.
#
# Triggers:
#   - Manually via "Run workflow" in the Actions tab
#   - On push to main (after CI passes)
#
# No GitHub Secrets required — this builds entirely locally in the runner.
#
# To install the APK: download the artifact from the workflow run, transfer
# to your phone, and install it (enable "Install unknown apps" for your file
# manager). Open the app → play until game over → tap "Revive & Keep Tower"
# → you should see a real Google test rewarded ad render.
name: Dev Build (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tower-slicer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
